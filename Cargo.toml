[package]
name = "mcpg-operator"
description = "Kubernetes operator for managing MCPG (Model Context Protocol Gateway) deployments"
version = "0.1.0-beta.20"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/mcpg-dev/mcpg-operator"
authors = ["MCPG contributors <opensource@mcpg.dev>"]


[[bin]]
name = "mcpg-operator"
path = "src/main.rs"

# crdgen lives here so it has a concrete k8s-openapi version
# pinned via this crate's [dependencies]. The Helm-chart sync
# target invokes:
#   cargo run -p mcpg-operator --bin crdgen -- --split-by-kind helm/charts/mcpg-operator/crds/
[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[lib]
name = "mcpg_operator"
path = "src/lib.rs"

[features]
default = []

[dependencies]
# Operator-api: re-exports the CRD types.
mcpg-operator-api = { git = "https://github.com/mcpg-dev/mcpg-operator-api", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }

# Plugin verification + OCI pull. The operator re-uses the
# gateway's exact verification path so admission-time + load-
# time checks are byte-equivalent (no shim layer to drift).
# Default features only — no `wasm` feature pulls wasmtime in.
mcpg-plugin-host = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }

# Kubernetes client + controller runtime.
kube = { version = "3", default-features = false, features = [
    "client",
    "rustls-tls",
    "runtime",
    "derive",
    "admission",
] }
k8s-openapi = { version = "0.27", features = ["v1_32"] }

async-trait = "0.1"
schemars = { version = "1", features = ["chrono04"] }

# Async runtime + HTTP.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Direct rustls dep so main() can install a process-default CryptoProvider.
# Required: mcpg-plugin-host → oci-client → jsonwebtoken 10 pulls aws-lc-rs
# alongside ring (kube / axum-server); rustls 0.23 then refuses to auto-pick
# and the binary panics on the FIRST TLS handshake (kube client connect).
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "compression-br"] }
hyper = "1"

# Telemetry.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus-client = "0.22"

# (De)serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling.
thiserror = "1"
anyhow = "1"

# Crypto + hashing — used for config-hash status reporting.
sha2 = "0.10"
hex = "0.4"

# Misc.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
once_cell = "1"
rand = "0.8"
# k8s-openapi 0.27 carries jiff::Timestamp on its time-typed
# fields (LeaseSpec.renew_time, etc). We need it as a direct
# dep to construct + compare timestamps. Pin to the version
# k8s-openapi re-exports.
jiff = "0.2"
# Pull-secret base64 decoding (.dockerconfigjson) + signing-key
# format autodetection (raw / base64 / hex).
base64 = "0.22"
# Plugin controller writes pulled OCI artefacts to a tempdir
# before unpacking + verifying.
tempfile = "3"

# Sigstore — cosign keyless verification + SLSA L3 provenance.
# `default-features = false` + `rustls-tls` keeps us out of the
# OpenSSL link tree (the operator + gateway are both rustls-only;
# `deny.toml` bans openssl + openssl-sys + native-tls).
# Feature set is minimal: `verify` for the signature path,
# `sigstore-trust-root` for fetching the public Sigstore TUF
# root at boot. We don't take signing / Fulcio-issuance
# features.
sigstore = { version = "0.14", default-features = false, features = [
    "cosign",
    "sigstore-trust-root",
    "rustls-tls",
] }
# Used by the cosign verifier to walk the in-toto attestation
# predicate when the SLSA path is configured.
serde_with = "3"
# `regex` is the matcher behind `cosign_identity.certificate_identity_regexp`.
# It's already pulled transitively via kube-client → jsonpath-rust;
# making it a direct dep makes the cosign verifier's source legible.
regex = "1"

[dev-dependencies]
pretty_assertions = "1"
serde_yaml = "0.9"
tempfile = "3"
temp-env = "0.3"
base64 = "0.22"
# Consistency guard (tests only). The operator renders the gateway's
# config JSON but is otherwise schema-blind to it. This dev-dep lets
# `merge_plugins`' tests assert the rendered output actually
# deserialises into the gateway's real `AppConfig` — exercising its
# `deny_unknown_fields` and custom capability deserialiser — so a
# drift like the `plugins` object→array flatten fails in operator CI
# instead of at a customer's gateway boot. NOT a runtime dependency;
# the operator binary never links the gateway.
mcpg = { git = "https://github.com/mcpg-dev/mcpg", tag = "v0.1.0-beta.22", version = "=0.1.0-beta.22" }

[lints.rust]
# The `fleet` cfg stays declared even where the feature itself is absent:
# the published manifest drops the managed-service-only feature while the
# #[cfg(feature = "fleet")] guards remain in the source.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"fleet\"))"] }
